name: Herasat Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.herasat --project-name herasat --no-pub .

      - name: Configure Android app
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Herasat"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Remove Flutter's generated sample test
        run: rm -f test/widget_test.dart

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Run APK smoke test in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-x86_64-release.apk
            adb shell am force-stop com.herasat.herasat
            adb shell monkey -p com.herasat.herasat 1
            sleep 15
            adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumedActivity" | grep -q "com.herasat.herasat"
            adb shell uiautomator dump /sdcard/herasat-window.xml >/dev/null
            adb pull /sdcard/herasat-window.xml /tmp/herasat-window.xml >/dev/null
            grep -q "HERASAT" /tmp/herasat-window.xml
            if grep -Eq "هسته VPN راه‌اندازی نشد|VPN core failed to initialize" /tmp/herasat-window.xml; then
              echo "VPN core initialization error is visible in the app"
              exit 1
            fi
            adb logcat -d -t 5000 > /tmp/herasat-logcat.txt
            if grep -Eq "FATAL EXCEPTION|Process: com\\.herasat\\.herasat" /tmp/herasat-logcat.txt; then
              echo "App crashed during emulator smoke test"
              exit 1
            fi

      - name: Upload split APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Herasat-Android-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
